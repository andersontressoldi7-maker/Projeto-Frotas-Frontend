<div class="form-wrapper">
  <div class="form-header">
    <div>
      <div class="d-flex align-items-center flex-wrap gap-3 mb-1">
        <h2 class="h4 fw-bold mb-0">{{ config.titulo }}</h2>
        <app-ia-cadastro></app-ia-cadastro>
      </div>
      <p *ngIf="config.subtitulo" class="text-muted small mb-0">{{ config.subtitulo }}</p>
    </div>
    <button class="btn btn-outline-secondary btn-sm" (click)="onCancelar()">
      <i class="bi bi-x-lg"></i> Cancelar
    </button>
  </div>

  <div *ngIf="carregando" class="d-flex justify-content-center align-items-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div class="form-container" *ngIf="!carregando">
    <div *ngFor="let secao of config.secoes" class="card border-0 shadow-sm mb-3">
      <div class="card-body p-4">
        <h5 class="card-title mb-4">{{ secao.titulo }}</h5>

        <div class="form-row">
          <ng-container *ngFor="let campo of secao.campos">
          <div *ngIf="exibirCampo(campo)" [ngClass]="obterClasseTamanho(campo)">
            <div class="form-group">
              <label class="form-label d-flex align-items-center gap-2" [class.required]="campo.obrigatorio">
                <span>{{ campo.label }}</span>
                <span class="atalhos-cadastro" *ngIf="campo.tipo === 'select' && campo.atalhoCadastro">
                  <button type="button" class="btn-atalho-cadastro" (click)="onCriarNovoCampo(campo, 'novo')">
                    <i class="bi bi-plus-circle"></i> Novo (F9)
                  </button>
                  <button type="button" class="btn-atalho-cadastro" (click)="onCriarNovoCampo(campo, 'editar')">
                    <i class="bi bi-pencil"></i> Editar (F8)
                  </button>
                </span>
              </label>

              <input
                *ngIf="['text', 'email', 'tel', 'number', 'date', 'time', 'datetime-local'].includes(campo.tipo)"
                [type]="campo.tipo"
                class="form-control"
                [ngModel]="dadosFormulario[campo.nome]"
                (ngModelChange)="onCampoAlterado(campo, $event)"
                [placeholder]="campo.placeholder || ''"
                [readOnly]="campo.readOnly || false"
                [required]="campo.obrigatorio || false"
                [min]="campo.min ?? (campo.tipo === 'number' ? 0 : null)"
                [max]="campo.max ?? null"
                [step]="campo.tipo === 'number' ? 'any' : null"
                [class.is-invalid]="!isCampoValido(campo)">

              <div *ngIf="!isCampoValido(campo)" class="text-danger small mt-1">
                {{ mensagemErroCampo(campo) }}
              </div>

              <textarea
                *ngIf="campo.tipo === 'textarea'"
                class="form-control"
                [(ngModel)]="dadosFormulario[campo.nome]"
                [placeholder]="campo.placeholder || ''"
                rows="4"
                [required]="campo.obrigatorio || false"></textarea>

              <div *ngIf="!isCampoValido(campo) && campo.tipo === 'textarea'" class="text-danger small mt-1">
                {{ mensagemErroCampo(campo) }}
              </div>

              <select
                *ngIf="campo.tipo === 'select'"
                class="form-control"
                [(ngModel)]="dadosFormulario[campo.nome]"
                [required]="campo.obrigatorio || false"
                (keydown.F9)="campo.atalhoCadastro && onCriarNovoCampo(campo, 'novo')"
                (keydown.F8)="campo.atalhoCadastro && onCriarNovoCampo(campo, 'editar')">
                <option value="">Selecione...</option>
                <option *ngFor="let opt of campo.opcoes" [value]="opt.id">{{ opt.label }}</option>
              </select>
              <div *ngIf="!isCampoValido(campo) && campo.tipo === 'select'" class="text-danger small mt-1">
                {{ mensagemErroCampo(campo) }}
              </div>

              <div
                *ngIf="campo.tipo === 'pills'"
                class="pills-container">
                <button
                  *ngFor="let opt of campo.opcoes"
                  type="button"
                  class="pill-btn"
                  [class.ativo]="dadosFormulario[campo.nome] === opt.id"
                  (click)="dadosFormulario[campo.nome] = opt.id">
                  {{ opt.label }}
                </button>
              </div>

              <div
                *ngIf="campo.tipo === 'currency'"
                class="input-group">
                <span class="input-group-text">R$</span>
                <input
                  type="number"
                  class="form-control"
                  [(ngModel)]="dadosFormulario[campo.nome]"
                  [placeholder]="campo.placeholder || '0,00'"
                  step="0.01"
                  min="0"
                  [required]="campo.obrigatorio || false"
                  [class.is-invalid]="!isCampoValido(campo)">
              </div>
              <div *ngIf="campo.tipo === 'currency' && !isCampoValido(campo)" class="text-danger small mt-1">
                {{ campo.mensagemErro || (campo.label + ' deve ser maior ou igual a zero.') }}
              </div>

              <label
                *ngIf="campo.tipo === 'checkbox'"
                class="checkbox-label">
                <input
                  type="checkbox"
                  [(ngModel)]="dadosFormulario[campo.nome]">
                <span>{{ campo.label }}</span>
              </label>

              <div *ngIf="campo.tipo === 'toggle'" class="toggle-wrapper">
                <button type="button" class="toggle-switch" [class.active]="!!dadosFormulario[campo.nome]" (click)="alternarToggle(campo.nome)">
                  <span class="toggle-knob"></span>
                </button>
                <span class="toggle-label">{{ campo.label }}</span>
              </div>

              <small *ngIf="campo.helpText" class="text-muted d-block mt-2">
                {{ campo.helpText }}
              </small>
            </div>
          </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <div class="form-actions" *ngIf="!carregando">
    <button class="btn btn-light border" (click)="onCancelar()">
      {{ config.botaoCancelLabel || 'Cancelar' }}
    </button>
    <button
      class="btn btn-success"
      (click)="onSalvar()"
      [disabled]="!validarFormulario() || salvando">
      <span *ngIf="salvando" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      <i *ngIf="!salvando" class="bi bi-check-circle"></i>
      {{ salvando ? 'Salvando...' : (config.botaoPrincipalLabel || (config.modoEdicao ? 'Atualizar' : 'Criar')) }}
    </button>
  </div>
</div>
