<app-sidebar></app-sidebar>
<app-header></app-header>
<div class="dashboard-wrapper">
  <main class="content-layout">
    <div class="container-fluid p-4">
      <div class="form-wrapper">
        <div class="form-header d-flex justify-content-between align-items-center mb-3">
          <div>
            <h2 class="h4 fw-bold mb-1">{{ titulo }}</h2>
            <p class="text-muted small mb-0">Nome e opções de resposta da escala de avaliação</p>
          </div>
          <button class="btn btn-outline-secondary btn-sm" (click)="onCancelar()">
            <i class="bi bi-x-lg"></i> Cancelar
          </button>
        </div>

        <div *ngIf="carregando" class="d-flex justify-content-center align-items-center py-5">
          <div class="spinner-border text-success" role="status"></div>
        </div>

        <div class="card border-0 shadow-sm mb-3" *ngIf="!carregando">
          <div class="card-body p-4">
            <div class="mb-3">
              <label class="form-label required">Nome</label>
              <input type="text" class="form-control" [(ngModel)]="formulario.nome" placeholder="Ex.: Situação">
            </div>

            <div class="mb-2">
              <label class="form-label required d-block">Opções (mínimo 2)</label>

              <div class="d-flex align-items-center gap-2 mb-2" *ngFor="let opcao of formulario.opcoes; let i = index; trackBy: rastrearPorIndice">
                <input type="text" class="form-control" [(ngModel)]="formulario.opcoes[i]" [placeholder]="'Opção ' + (i + 1)">
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="removerOpcao(i)" [disabled]="formulario.opcoes.length <= 2">
                  <i class="bi bi-trash"></i>
                </button>
              </div>

              <button type="button" class="btn btn-outline-success btn-sm" (click)="adicionarOpcao()">
                <i class="bi bi-plus-lg"></i> Adicionar opção
              </button>
            </div>
          </div>
        </div>

        <div class="form-actions d-flex justify-content-end gap-2" *ngIf="!carregando">
          <button class="btn btn-light border" (click)="onCancelar()">Cancelar</button>
          <button class="btn btn-success" (click)="onSalvar()" [disabled]="!podeSalvar()">
            <i class="bi bi-check-circle"></i> {{ modoEdicao ? 'Atualizar' : 'Criar' }}
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
