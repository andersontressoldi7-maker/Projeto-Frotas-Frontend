<app-sidebar></app-sidebar>
<app-header></app-header>
<div class="dashboard-wrapper">
  <main class="content-layout">
    <app-shared-grid
      [title]="title"
      [subtitle]="subtitle"
      [columns]="columns"
      [data]="data"
      [filtragemNoServidor]="true"
      [opcoesFiltrosRemotas]="opcoesFiltrosRemotas"
      [carregando]="carregando"
      [paginaAtual]="paginaAtual"
      [temProximaPagina]="temProximaPagina"
      [primaryBtnLabel]="primaryBtnLabel"
      (primaryBtnClick)="onPrimaryAction()"
      (filterApplied)="onFilterApplied($event)"
      (editClick)="onEditClick($event)"
      (deleteClick)="onDeleteClick($event)"
      (paginaAlterada)="mudarPagina($event)">
    </app-shared-grid>
  </main>
</div>
