<div class="login-page d-flex align-items-center justify-content-center">

  <button class="btn theme-toggle-btn rounded-circle d-flex align-items-center justify-content-center" (click)="themeService.alternarTema()">
    <i class="bi" [class.bi-sun-fill]="themeService.estaEscuro()" [class.bi-moon-fill]="!themeService.estaEscuro()"></i>
  </button>

  <div class="card border-0 shadow-sm login-card">
    <div class="card-body p-4 p-md-5">
      <div class="brand d-flex align-items-center mb-4">
        <div class="brand-icon me-2">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="14" fill="#40916c"/>
            <path d="M24 10C18.477 10 14 14.477 14 20C14 27.5 24 38 24 38C24 38 34 27.5 34 20C34 14.477 29.523 10 24 10Z" fill="#ffffff" fill-opacity="0.15"/>
            <path d="M19 20.5L22.5 24L29 17" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">FrotaCheck</span>
      </div>

      <ng-container *ngIf="etapa === 'solicitar'; else redefinirTpl">
        <h2 class="h4 fw-bold mb-1">Esqueceu a senha?</h2>
        <p class="text-muted small mb-4">Informe seu email e enviaremos um código de verificação.</p>

        <form (ngSubmit)="onSolicitarCodigo()">
          <div class="form-group mb-4">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" name="email" class="form-control" [(ngModel)]="email" placeholder="voce@empresa.com" autocomplete="email" required>
          </div>

          <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2" [disabled]="carregando">
            <span *ngIf="!carregando">Enviar código</span>
            <span *ngIf="carregando" class="spinner-border spinner-border-sm" role="status"></span>
            <span *ngIf="carregando">Enviando...</span>
          </button>

          <p class="register text-center small mb-0 mt-3"><a routerLink="/login" class="text-decoration-none back-link">Voltar para o login</a></p>
        </form>
      </ng-container>

      <ng-template #redefinirTpl>
        <h2 class="h4 fw-bold mb-1">Redefinir senha</h2>
        <p class="text-muted small mb-4">Digite o código enviado para <strong>{{ email }}</strong> e defina uma nova senha.</p>

        <form (ngSubmit)="onRedefinirSenha()">
          <div class="form-group mb-3">
            <label class="form-label" for="codigo">Código de verificação</label>
            <input id="codigo" type="text" name="codigo" class="form-control" [(ngModel)]="codigo" placeholder="000000" maxlength="6" required>
          </div>

          <div class="form-group mb-3">
            <label class="form-label" for="novaSenha">Nova senha</label>
            <div class="input-group">
              <input id="novaSenha" [type]="mostrarSenha ? 'text' : 'password'" name="novaSenha" class="form-control" [(ngModel)]="novaSenha" placeholder="••••••••" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary" type="button" (click)="alternarSenha()">
                <i class="bi" [class.bi-eye]="!mostrarSenha" [class.bi-eye-slash]="mostrarSenha"></i>
              </button>
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="form-label" for="confirmarNovaSenha">Confirmar nova senha</label>
            <div class="input-group">
              <input id="confirmarNovaSenha" [type]="mostrarConfirmarSenha ? 'text' : 'password'" name="confirmarNovaSenha" class="form-control" [(ngModel)]="confirmarNovaSenha" placeholder="••••••••" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary" type="button" (click)="alternarConfirmarSenha()">
                <i class="bi" [class.bi-eye]="!mostrarConfirmarSenha" [class.bi-eye-slash]="mostrarConfirmarSenha"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2" [disabled]="carregando">
            <span *ngIf="!carregando">Redefinir senha</span>
            <span *ngIf="carregando" class="spinner-border spinner-border-sm" role="status"></span>
            <span *ngIf="carregando">Redefinindo...</span>
          </button>

          <p class="register text-center small mb-0 mt-3"><a (click)="voltarParaSolicitar()" class="text-decoration-none back-link" role="button">Reenviar código</a></p>
        </form>
      </ng-template>
    </div>
  </div>
</div>
