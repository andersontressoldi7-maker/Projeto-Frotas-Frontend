<div class="login-page d-flex align-items-center justify-content-center">

  <button class="btn theme-toggle-btn rounded-circle d-flex align-items-center justify-content-center" (click)="themeService.alternarTema()">
    <i class="bi" [class.bi-sun-fill]="themeService.estaEscuro()" [class.bi-moon-fill]="!themeService.estaEscuro()"></i>
  </button>

  <div class="card border-0 shadow-sm login-card">
    <div class="card-body p-4 p-md-5">
      <div class="brand d-flex align-items-center mb-4">
        <div class="brand-icon me-2">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="14" fill="#40916c"/>
            <path d="M24 10C18.477 10 14 14.477 14 20C14 27.5 24 38 24 38C24 38 34 27.5 34 20C34 14.477 29.523 10 24 10Z" fill="#ffffff" fill-opacity="0.15"/>
            <path d="M19 20.5L22.5 24L29 17" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">FrotaCheck</span>
      </div>

      <h2 class="h4 fw-bold mb-1">Criar conta</h2>
      <p class="text-muted small mb-4">Cadastre sua empresa para começar.</p>

      <form (ngSubmit)="onRegistrar()">
        <div class="form-group mb-3">
          <label class="form-label" for="razaoSocial">Razão social</label>
          <input id="razaoSocial" type="text" name="razaoSocial" class="form-control" [(ngModel)]="razaoSocial" placeholder="Razão social da empresa" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="fantasia">Nome fantasia</label>
          <input id="fantasia" type="text" name="fantasia" class="form-control" [(ngModel)]="fantasia" placeholder="Nome fantasia" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="cnpj">CNPJ</label>
          <input id="cnpj" type="text" name="cnpj" class="form-control" [(ngModel)]="cnpj" placeholder="00.000.000/0000-00" maxlength="18" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="usuario">Usuário</label>
          <input id="usuario" type="text" name="usuario" class="form-control" [(ngModel)]="usuario" placeholder="Nome de usuário" autocomplete="username" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="senha">Senha</label>
          <div class="input-group">
            <input id="senha" [type]="mostrarSenha ? 'text' : 'password'" name="senha" class="form-control" [(ngModel)]="senha" placeholder="••••••••" autocomplete="new-password" required>
            <button class="btn btn-outline-secondary" type="button" (click)="alternarSenha()">
              <i class="bi" [class.bi-eye]="!mostrarSenha" [class.bi-eye-slash]="mostrarSenha"></i>
            </button>
          </div>
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="confirmarSenha">Confirmar senha</label>
          <div class="input-group">
            <input id="confirmarSenha" [type]="mostrarConfirmarSenha ? 'text' : 'password'" name="confirmarSenha" class="form-control" [(ngModel)]="confirmarSenha" placeholder="••••••••" autocomplete="new-password" required>
            <button class="btn btn-outline-secondary" type="button" (click)="alternarConfirmarSenha()">
              <i class="bi" [class.bi-eye]="!mostrarConfirmarSenha" [class.bi-eye-slash]="mostrarConfirmarSenha"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2" [disabled]="carregando">
          <span *ngIf="!carregando">Criar conta</span>
          <span *ngIf="carregando" class="spinner-border spinner-border-sm" role="status"></span>
          <span *ngIf="carregando">Criando...</span>
        </button>

        <p class="register text-center small mb-0 mt-3">Já tem conta? <a routerLink="/login" class="text-decoration-none">Entrar</a></p>
      </form>
    </div>
  </div>
</div>
