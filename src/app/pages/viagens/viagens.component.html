<app-sidebar></app-sidebar>
<app-header></app-header>
<div class="dashboard-wrapper">
  <main class="content-layout">
    <app-shared-grid
      [title]="titulo"
      [subtitle]="subtitulo"
      [columns]="colunas"
      [data]="dados"
      [filtragemNoServidor]="true"
      [opcoesFiltrosRemotas]="opcoesFiltrosRemotas"
      [carregando]="carregando"
      [paginaAtual]="paginaAtual"
      [temProximaPagina]="temProximaPagina"
      [primaryBtnLabel]="rotuloBotaoPrimario"
      (primaryBtnClick)="aoAcaoPrimaria()"
      (filterApplied)="aoFiltroAplicado($event)"
      (editClick)="aoEditar($event)"
      (deleteClick)="aoExcluir($event)"
      (paginaAlterada)="mudarPagina($event)">
    </app-shared-grid>
  </main>
</div>
