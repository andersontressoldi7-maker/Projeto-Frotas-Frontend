<header class="navbar border-bottom px-3 px-md-4 py-2 fixed-top header-dashboard justify-content-end">
  <div class="d-flex align-items-center gap-3 header-actions-row">
    <div class="position-relative">
      <button class="btn position-relative p-1" (click)="alternarNotificacoes()">
        <i class="bi bi-bell fs-5"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle notif-dot" *ngIf="notificacoesNaoLidas > 0"></span>
      </button>

      <div class="dropdown-panel notif-panel shadow-sm" *ngIf="notificacoesAbertas">
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
          <span class="fw-bold small">Notificações</span>
          <span class="badge bg-danger rounded-pill" *ngIf="notificacoesNaoLidas > 0">{{ notificacoesNaoLidas }}</span>
        </div>

        <div class="notif-categorias px-3 py-2 border-bottom d-flex gap-2 flex-wrap" *ngIf="!carregandoNotificacoes() && notificacoes().length > 0">
          <button type="button" class="categoria-chip" [class.ativa]="categoriaSelecionada() === 'Todas'" (click)="selecionarCategoria('Todas')">Todas</button>
          <button type="button" class="categoria-chip" *ngFor="let categoria of categorias" [class.ativa]="categoriaSelecionada() === categoria" (click)="selecionarCategoria(categoria)">{{ categoria }}</button>
        </div>

        <div class="d-flex align-items-center justify-content-center py-4" *ngIf="carregandoNotificacoes()">
          <span class="spinner-border spinner-border-sm" role="status"></span>
        </div>

        <div class="d-flex align-items-center justify-content-center py-4 px-3 text-center" *ngIf="!carregandoNotificacoes() && notificacoes().length === 0">
          <p class="text-muted small mb-0">Nenhuma notificação por enquanto.</p>
        </div>

        <div class="d-flex align-items-center justify-content-center py-4 px-3 text-center" *ngIf="!carregandoNotificacoes() && notificacoes().length > 0 && notificacoesFiltradas().length === 0">
          <p class="text-muted small mb-0">Nenhuma notificação nesta categoria.</p>
        </div>

        <div class="notif-list" *ngIf="!carregandoNotificacoes() && notificacoesFiltradas().length > 0">
          <div class="notif-item px-3 py-2" *ngFor="let notificacao of notificacoesFiltradas()" [class.nao-lida]="!notificacao.lida">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <p class="fw-bold small mb-1">{{ notificacao.titulo }}</p>
              <span class="badge bg-secondary-subtle text-secondary small fw-normal">{{ notificacao.categoria }}</span>
            </div>
            <p class="text-muted small mb-1">{{ notificacao.mensagem }}</p>
            <span class="text-muted" style="font-size: 0.75rem;">{{ notificacao.data }}</span>
          </div>
        </div>
      </div>
    </div>

    <button class="btn theme-toggle-btn p-1" (click)="themeService.alternarTema()" title="Alternar tema">
      <i class="bi" [class.bi-sun-fill]="themeService.estaEscuro()" [class.bi-moon-fill]="!themeService.estaEscuro()"></i>
    </button>

    <div class="position-relative" *ngIf="temMultiplasEmpresas">
      <button class="btn d-flex align-items-center gap-2 p-1 px-2 empresa-toggle-btn" (click)="alternarMenuEmpresa()" [disabled]="trocandoEmpresa()">
        <i class="bi bi-building"></i>
        <span class="small fw-medium d-none d-sm-inline">{{ empresaAtiva?.fantasia || empresaAtiva?.razaoSocial }}</span>
        <i class="bi bi-chevron-down small"></i>
      </button>

      <div class="dropdown-panel empresa-panel shadow-sm" *ngIf="empresaMenuAberto">
        <div class="px-3 py-2 border-bottom">
          <span class="fw-bold small">Trocar empresa</span>
        </div>
        <button class="dropdown-panel-item" *ngFor="let empresa of empresas()" [class.ativa]="empresa.ativa" [disabled]="trocandoEmpresa()" (click)="selecionarEmpresa(empresa)">
          <i class="bi me-2" [class.bi-check-circle-fill]="empresa.ativa" [class.bi-circle]="!empresa.ativa"></i>
          {{ empresa.fantasia || empresa.razaoSocial }}
        </button>
      </div>
    </div>

    <div class="position-relative">
      <button class="btn d-flex align-items-center gap-2 p-1" (click)="alternarMenuUsuario()">
        <div class="avatar bg-success text-white fw-bold d-flex align-items-center justify-content-center">
          {{ iniciaisUsuario }}
        </div>
        <span class="text-muted small fw-medium d-none d-sm-inline">{{ emailUsuario }}</span>
      </button>

      <div class="dropdown-panel user-panel shadow-sm" *ngIf="menuUsuarioAberto">
        <button class="dropdown-panel-item" (click)="abrirSuporte()">
          <i class="bi bi-life-preserver me-2"></i> Suporte
        </button>
        <button class="dropdown-panel-item text-danger" (click)="sair()">
          <i class="bi bi-box-arrow-right me-2"></i> Sair
        </button>
      </div>
    </div>
  </div>
</header>
