<div class="container-fluid p-4">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h4 fw-bold mb-1 text-body">{{ title }}</h2>
      <p class="text-muted small mb-0">{{ subtitle }}</p>
    </div>
    <button *ngIf="primaryBtnLabel" class="btn btn-success d-flex align-items-center gap-2 px-3 fw-medium" (click)="primaryBtnClick.emit()">
      <i class="bi bi-plus-lg"></i>
      {{ primaryBtnLabel }}
    </button>
  </div>

  <div class="card border-0 shadow-sm mb-4 filtro-section">
    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center p-3" (click)="alternarFiltros()" style="cursor: pointer;">
      <div class="d-flex align-items-center gap-2 fw-semibold text-body">
        <i class="bi bi-filtro-left fs-5 text-success"></i>
        <span>Filtros</span>
        <span *ngIf="filtrosAtivos.length > 0" class="badge bg-success-subtle text-success rounded-pill font-monospace">{{ filtrosAtivos.length }}</span>
      </div>
      <i class="bi text-muted" [class.bi-chevron-down]="!filtroExpandido" [class.bi-chevron-up]="filtroExpandido"></i>
    </div>

    <div class="card-body pt-0 px-3 pb-3" *ngIf="filtroExpandido">
      <div class="d-flex align-items-center gap-2 mb-3 flex-wrap border-top pt-3">
        <span class="small text-muted fw-medium">Filtrar por:</span>
        <div class="dropdown" *ngIf="obterFiltrosDisponiveis().length > 0">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1" type="button" id="addFilterDrop" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-plus"></i> Adicionar campo
          </button>
          <ul class="dropdown-menu shadow-sm" aria-labelledby="addFilterDrop">
            <li *ngFor="let opt of obterFiltrosDisponiveis()">
              <a class="dropdown-menu-item dropdown-item small" (click)="adicionarFiltro(opt)">{{ opt.label }}</a>
            </li>
          </ul>
        </div>
      </div>

      <div class="row g-3 align-items-end" *ngIf="filtrosAtivos.length > 0">
        <div class="col-12 col-md-4 col-lg-3" *ngFor="let filtro of filtrosAtivos; let i = index">
          <div class="filtro-field-box p-2 rounded position-relative">
            <label class="form-label small text-muted mb-1 d-flex justify-content-between align-items-center">
              <span>{{ filtro.option.label }}</span>
              <button type="button" class="btn-close ms-auto small-close" (click)="removerFiltro(i, filtro.option.key)"></button>
            </label>

            <ng-container [ngSwitch]="filtro.option.type">
              <input *ngSwitchCase="'text'" type="text" class="form-control form-control-sm" [(ngModel)]="modeloFiltrosAtuais[filtro.option.key]" (keydown.enter)="aplicarFiltros()"/>
              <input *ngSwitchCase="'number'" type="number" class="form-control form-control-sm" [(ngModel)]="modeloFiltrosAtuais[filtro.option.key]" (keydown.enter)="aplicarFiltros()"/>
              <input *ngSwitchCase="'date'" type="date" class="form-control form-control-sm" [(ngModel)]="modeloFiltrosAtuais[filtro.option.key]"/>

              <select *ngSwitchCase="'select'" class="form-select form-select-sm" [(ngModel)]="modeloFiltrosAtuais[filtro.option.key]">
                <option value="">Todos</option>
                <option *ngFor="let opt of filtro.option.options" [value]="opt">{{ opt }}</option>
              </select>

              <div *ngSwitchCase="'multi-select'" class="dropdown w-100">
                <button class="btn btn-sm btn-light w-100 text-start border d-flex justify-content-between align-items-center" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                  <span class="text-truncate small">
                    {{ modeloFiltrosAtuais[filtro.option.key]?.length ? modeloFiltrosAtuais[filtro.option.key].join(', ') : 'Selecionar' }}
                  </span>
                  <i class="bi bi-chevron-down text-muted text-xs"></i>
                </button>
                <ul class="dropdown-menu p-2 shadow-sm w-100" style="max-height: 200px; overflow-y: auto;">
                  <li *ngFor="let opt of filtro.option.options" class="form-check mb-1">
                    <input type="checkbox" class="form-check-input ms-0 me-2" [id]="filtro.option.key + '-' + opt" [checked]="valorMultiploMarcado(filtro.option.key, opt)" (change)="alternarValorMultiplo(filtro.option.key, opt)"/>
                    <label class="form-check-label small text-body" [for]="filtro.option.key + '-' + opt">{{ opt }}</label>
                  </li>
                </ul>
              </div>
            </ng-container>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-1" *ngIf="filtrosAtivos.length > 0">
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="limparFiltros()">
          <i class="bi bi-x-lg me-1"></i> Limpar Filtros
        </button>
        <button type="button" class="btn btn-sm btn-success" (click)="aplicarFiltros()">
          <i class="bi bi-check-lg me-1"></i> Aplicar Filtros
        </button>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th *ngFor="let col of columns" class="text-muted small fw-semibold py-3 px-4" [class.text-end]="col.key === 'acoes'">
              {{ col.label }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of dadosFiltrados">
            <td *ngFor="let col of columns" class="px-4 py-3 text-body fs-6" [class.text-end]="col.key === 'acoes'">
              <ng-container [ngSwitch]="col.type || col.key">
                <span *ngSwitchCase="'badge'" class="badge rounded-pill px-3 fw-normal" [ngClass]="obterClassesBadge(col, row[col.key])">
                  {{ row[col.key] }}
                </span>
                <div *ngSwitchCase="'acoes'" class="d-flex justify-content-end gap-2">
                  <button class="btn btn-link text-secondary p-1 hover-success" type="button" title="Editar" (click)="editClick.emit(row)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-link text-danger p-1 hover-danger-dark" type="button" title="Excluir" (click)="deleteClick.emit(row)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
                <span *ngSwitchDefault>{{ row[col.key] }}</span>
              </ng-container>
            </td>
          </tr>
          <tr *ngIf="dadosFiltrados.length === 0">
            <td [attr.colspan]="columns.length" class="text-center py-5 text-muted small">
              {{ emptyMessage }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
